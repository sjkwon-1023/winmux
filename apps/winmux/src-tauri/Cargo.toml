# winmux 데스크톱 앱 (Tauri v2 글루) — bin 전용 크레이트.
# 로직은 winmux-core 에 있고 여기는 상태 배선·커맨드·sink 글루만 둔다.

[package]
name = "winmux-app"
version = "0.3.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# needsInput OS 토스트 (백로그 2026-08-11) — 공식 플러그인. Windows 백엔드는
# notify-rust → winrt-notification 의 **순수 Rust WinRT 바인딩**이라 C 툴체인도
# 아키텍처별 바이너리도 없다 — ARM64 크로스 빌드에 추가 준비물이 없다 (rfd 와
# 같은 판단). default features 는 비어 있고, `windows7-compat` 은 일부러 켜지
# 않는다: 대상은 Windows 10/11 이고 그 feature 는 별도 창을 띄우는 win7 폴백을
# 끌고 온다.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
winmux-core = { path = "../../../crates/winmux-core" }

# 메모리 워치독 (계획 16단계 C-2) — Toolhelp 자손 스캔 + PrivateUsage 조회.
# 직접 의존 + features 명시 (계획 0장 — Cargo.lock 전이 의존은 feature 활성이
# 아니다). Win32_System_Threading 은 OpenProcess/PROCESS_QUERY_LIMITED_INFORMATION
# 의 실제 위치라 계획의 3종에 추가로 필요하다.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
# 워크스페이스 폴더 선택 대화상자 (Windows 네이티브 IFileDialog). Windows 백엔드는
# windows-sys 0.61(위와 같은 버전) 위의 순수 Rust 구현이라 C 툴체인·아키텍처별
# 바이너리가 없고 ARM64 크로스 빌드에도 추가 준비물이 없다. default features
# (xdg-portal·wayland)는 Linux 백엔드 전용이라 끈다.
rfd = { version = "0.17", default-features = false }
# 셸 앱 신원(AUMID) 등록 — `app_identity` 모듈. 토스트가 뜨려면 시작 메뉴 .lnk 에
# System.AppUserModel.ID 를 심어야 하는데 그건 COM(IShellLink·IPropertyStore) 이라
# windows-sys 의 raw FFI 로는 vtable 을 손으로 깎아야 한다 — COM 래퍼가 있는
# `windows` 크레이트를 쓴다. 0.61 은 `tauri-winrt-notification` 이 이미 끌고 오는
# 버전과 같아 그래프에 크레이트가 새로 늘지 않는다 (feature 는 가산이라 아래 목록만
# 추가로 켜진다).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # PKEY_AppUserModel_ID 는 windows-rs 에서 여기 산다 (Shell 이 아니다).
    "Win32_Storage_EnhancedStorage",
    # IShellLinkW::GetPath 가 받는 WIN32_FIND_DATAW.
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
