# wmux 데스크톱 앱 (Tauri v2 글루) — bin 전용 크레이트.
# 로직은 wmux-core 에 있고 여기는 상태 배선·커맨드·sink 글루만 둔다.

[package]
name = "wmux-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
wmux-core = { path = "../../../crates/wmux-core" }
